services:
  hugo:
    build: .
    ports:
      - "1313:1313"
    volumes:
      - .:/src
      - ~/.codex:/root/.codex
      - ~/.config/gh:/root/.config/gh:ro
      - ~/.gitconfig:/root/.gitconfig:ro
      - pre-commit-cache:/root/.cache/pre-commit
      - pip-cache:/root/.cache/pip
    command: server --bind 0.0.0.0 --buildDrafts --buildFuture
    stdin_open: true
    tty: true

volumes:
  pre-commit-cache:
  pip-cache:
